<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IP Geolocation Tracker</title>
    <script>
      function getLocation() {
        // Replace 'YOUR_API_KEY' with your actual API key from ipgeolocation.io
        const apiKey = "YOUR_API_KEY";
        const url = `https://api.ipgeolocation.io/ipgeo?apiKey=${apiKey}`;

        fetch(url)
          .then((response) => {
            if (!response.ok) {
              throw new Error("Network response was not ok");
            }
            return response.json();
          })
          .then((data) => {
            const location = `Country: ${data.country_name}, State: ${data.state_prov}, City: ${data.city}`;
            document.getElementById("location").innerText = location;
          })
          .catch((error) => {
            console.error("Error fetching location:", error);
            document.getElementById("location").innerText =
              "Unable to retrieve location.";
          });
      }
    </script>
  </head>
  <body onload="getLocation()">
    <h1>IP Geolocation Tracker</h1>
    <h2>Your Approximate Location:</h2>
    <p id="location">Fetching location...</p>
  </body>
</html>
